# Despliegue de Edge Functions desde GitHub Actions.
#
# Existe porque copilot-webhook (~305 KB) no cabe en el canal MCP de despliegue, y el entorno de
# desarrollo remoto no tiene CLI ni salida a la Management API de Supabase. La CI de GitHub sí.
#
# QUÉ DESPLIEGA: las funciones cuyo directorio cambió DESDE EL ÚLTIMO DESPLIEGUE EN VERDE — no desde el
# push anterior, para que un push que se quedó sin publicar (candado en rojo) lo recoja el siguiente.
# Si cambia supabase/functions/_shared/**, despliega TODAS las funciones del repo (cada una empaqueta su
# propia copia de _shared, así que un cambio compartido no llega a producción hasta que se redespliega
# cada consumidora).
#
# CÓMO USARLO (todo en el navegador, sin instalar nada):
#   1. Crear un Access Token en https://supabase.com/dashboard/account/tokens
#   2. Repo → Settings → Secrets and variables → Actions → New repository secret:
#        Name: SUPABASE_ACCESS_TOKEN   ·   Value: <el token>
#   3. Push, o "Run workflow" desde la pestaña Actions (opcionalmente indicando una función).
name: Desplegar Edge Function

on:
  workflow_dispatch:
    inputs:
      function:
        description: Función a desplegar (vacío = todas las que cambiaron)
        required: false
        default: copilot-webhook
  push:
    branches: [claude/supabase-agent-review-tvvg61]
    paths:
      - supabase/functions/**
      # `tests/**` está aquí porque el candado se puede caer por la PRUEBA y no por la función: el
      # 04-sep la v127 quedó en rojo por el lock de versión, el deploy se saltó, y el commit que lo
      # puso verde tocaba solo `tests/`. Sin esta ruta ese arreglo no dispara NADA y producción se
      # queda en la versión anterior sin que ninguna corrida salga en rojo para avisarlo.
      - tests/**
      - .github/workflows/deploy-copilot.yml
  # En un PR se corren las PRUEBAS pero NO se despliega (ver el `if` del job deploy). Sin esto, el
  # candado llegaba tarde: las pruebas solo corrían al hacer push a la rama de despliegue, o sea
  # DESPUÉS de fusionar, y un PR en rojo se veía igual de verde que uno sano.
  pull_request:
    paths:
      - supabase/functions/**
      - tests/**
      - .github/workflows/deploy-copilot.yml

concurrency:
  # Se serializa por REF: dos push a la rama de despliegue no se pisan, pero la corrida de pruebas de
  # un PR tampoco hace cola detrás de un deploy en curso (ni al revés).
  group: deploy-copilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CANDADO DEL DESPLIEGUE. Corre en los PR y en los push; el job de deploy DEPENDE de él, así que un
  # lock en rojo detiene la publicación. Hasta el 27-ago este workflow desplegaba a producción sin
  # ejecutar ninguna prueba, y la única del repo llevaba semanas rota sin que nadie lo notara. En este
  # sistema una regresión no se ve en un stack trace: se ve cuando el bot le dice algo equivocado a un
  # cliente.
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correr las suites
        run: |
          set -e
          node tests/golden.mjs
          node tests/test_shipday_campos.mjs
          node tests/test_semaforo.mjs
          node tests/test_catalogo_sync.mjs
          node tests/test_wati_order_direccion.mjs

  deploy:
    needs: pruebas
    # Un PR no despliega: solo prueba. La publicación ocurre al hacer push a la rama de despliegue.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Para preguntar por la última corrida que SÍ desplegó (ver "Decidir qué funciones desplegar").
      actions: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jbigmlcalcwiphqeudxd
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 0 = historia completa. Con fetch-depth 2 solo se podía diffear HEAD^..HEAD, o sea el ÚLTIMO
          # commit del push: en un push de dos commits que tocaran funciones distintas, la del primero
          # se quedaba sin desplegar y nadie se enteraba. Ese drift silencioso ya costó una vez perder
          # el upsertPedido de wati-order en producción (~06-ago).
          fetch-depth: 0

      - name: Comprobar secreto
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Falta SUPABASE_ACCESS_TOKEN. Agrégalo en Settings → Secrets → Actions y re-ejecuta. NO se desplegó nada."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decidir qué funciones desplegar
        if: steps.guard.outputs.ok == 'true'
        id: cuales
        run: |
          set -e
          MANUAL="${{ github.event.inputs.function }}"
          if [ -n "$MANUAL" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LISTA="$MANUAL"
          else
            # DESDE DÓNDE SE DIFFEA. `github.event.before` (el push anterior) parece la base obvia y
            # no lo es: si aquel push se quedó SIN desplegar —candado en rojo, o el arreglo no tocó
            # ninguna ruta vigilada— su cambio de función queda del lado de acá de la base y no se
            # publica nunca. Pasó el 04-sep con la v127: el commit rojo se saltó el deploy y el que
            # lo puso verde ya no traía la función en su rango, así que producción se quedó en v126
            # con la rama en verde. Un drift que no sale en rojo en ningún lado.
            #
            # La base correcta es el último commit que SÍ se desplegó, o sea el de la última corrida
            # de push que terminó en verde. Se toma el MÁS ANTIGUO de los candidatos que además sea
            # antepasado de HEAD (un force-push deja shas que ya no están en la rama), y así el rango
            # se ensancha solo hasta cubrir todo lo que quedó sin publicar. Si no hay ninguno válido
            # —rama nueva, primera corrida— se cae a HEAD^..HEAD, que es lo mejor disponible.
            VERDE=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-copilot.yml/runs?branch=${GITHUB_REF_NAME}&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha' 2>/dev/null || true)
            ANTES="${{ github.event.before }}"
            BASE=""
            for C in "$VERDE" "$ANTES"; do
              [ -n "$C" ] && [ "$C" != "null" ] || continue
              [ "$C" != "0000000000000000000000000000000000000000" ] || continue
              git cat-file -e "$C^{commit}" 2>/dev/null || continue
              git merge-base --is-ancestor "$C" HEAD || continue
              if [ -z "$BASE" ] || git merge-base --is-ancestor "$C" "$BASE"; then BASE="$C"; fi
            done
            [ -n "$BASE" ] || BASE="HEAD^"
            echo "Base del diff: $BASE (último verde: ${VERDE:-ninguno} · push anterior: ${ANTES:-ninguno})"
            CAMBIOS=$(git diff --name-only "$BASE" HEAD -- supabase/functions/ || true)
            if echo "$CAMBIOS" | grep -q 'supabase/functions/_shared/'; then
              # Un cambio en _shared afecta a todas: cada función empaqueta su propia copia.
              LISTA=$(ls -d supabase/functions/*/ | xargs -n1 basename | grep -v '^_shared$' | tr '\n' ' ')
            else
              LISTA=$(echo "$CAMBIOS" | awk -F/ '/^supabase\/functions\/[^_]/ {print $3}' | sort -u | tr '\n' ' ')
            fi
          fi
          echo "lista=$LISTA" >> "$GITHUB_OUTPUT"
          echo "A desplegar: ${LISTA:-(ninguna)}"

      - name: Instalar la CLI de Supabase
        if: steps.guard.outputs.ok == 'true' && steps.cuales.outputs.lista != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Desplegar
        if: steps.guard.outputs.ok == 'true' && steps.cuales.outputs.lista != ''
        run: |
          set -e
          for FN in ${{ steps.cuales.outputs.lista }}; do
            echo "::group::Desplegando $FN"
            supabase functions deploy "$FN" --project-ref "$PROJECT_REF" --no-verify-jwt
            echo "::endgroup::"
          done

      - name: Verificar versiones desplegadas
        if: steps.guard.outputs.ok == 'true' && steps.cuales.outputs.lista != ''
        run: |
          sleep 3
          for FN in ${{ steps.cuales.outputs.lista }}; do
            V=$(curl -s "https://${PROJECT_REF}.functions.supabase.co/${FN}" | grep -o '"version":"[^"]*"' || true)
            echo "$FN → ${V:-'(sin campo version)'}"
          done
